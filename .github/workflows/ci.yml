name: CI

on:
  push:
    branches: [radar-energia]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas
        run: pytest -q
