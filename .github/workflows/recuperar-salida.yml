name: Recuperar salida de una corrida

# Copia a datos/ultima_corrida la salida (artefacto) de una corrida anterior, sin reprocesar.
# Se dispara al subir cambios a config/recuperar.yml, que indica el run y el artefacto.
on:
  push:
    branches: [radar-energia]
    paths: [config/recuperar.yml]

permissions:
  contents: write
  actions: read

jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "run_id=$(grep '^run_id:' config/recuperar.yml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "artefacto=$(grep '^artefacto:' config/recuperar.yml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.artefacto }}
          run-id: ${{ steps.cfg.outputs.run_id }}
          github-token: ${{ github.token }}
          path: salida
      - name: Guardar en la rama
        run: |
          mkdir -p datos/ultima_corrida
          cp salida/bitacora.md salida/calidad.json salida/agg_mercado_mensual.* \
             salida/agg_distribucion_exposicion.* datos/ultima_corrida/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ultima_corrida
          git diff --cached --quiet && exit 0
          git commit -m "datos: carga histórica recuperada (run ${{ steps.cfg.outputs.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
