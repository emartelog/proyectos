name: Reconocimiento de fuentes SIMEM

# Descarga muestras de cada dataset registrado en config/fuentes.yml, las perfila y
# deja el resultado en datos/reconocimiento/ (commit en esta rama). Los datos completos
# quedan como artefacto descargable del run.
on:
  workflow_dispatch:
    inputs:
      hoy:
        description: "Fecha de referencia (AAAA-MM-DD). Vacío = hoy."
        required: false
      meses_maduro:
        description: "Meses atrás para la muestra madura"
        required: false
        default: "4"
  push:
    branches: [radar-energia]
    paths:
      - config/fuentes.yml
      - src/radar_energia/simem.py
      - src/radar_energia/reconocimiento.py
      - .github/workflows/reconocimiento.yml

permissions:
  contents: write

concurrency:
  group: reconocimiento-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconocimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Descargar y perfilar muestras
        env:
          HOY: ${{ inputs.hoy }}
          MESES_MADURO: ${{ inputs.meses_maduro || '4' }}
        run: |
          python -m radar_energia.reconocimiento \
            --meses-maduro "$MESES_MADURO" \
            ${HOY:+--hoy "$HOY"}

      - name: Publicar datos completos como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simem-crudo-${{ github.run_id }}
          path: datos/_crudo/
          retention-days: 30
          if-no-files-found: warn

      - name: Guardar resumen en la rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/reconocimiento
          if git diff --cached --quiet; then
            echo "Sin cambios en el reconocimiento."
            exit 0
          fi
          git commit -m "datos: reconocimiento SIMEM (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Resumen del run
        if: always()
        run: cat datos/reconocimiento/RESUMEN.md >> "$GITHUB_STEP_SUMMARY" || true
